name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web app from app.py (skipped if app.py is not in the repo)
        run: python sync.py

      - run: npm install

      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'

      - name: App icon + splash (non-fatal)
        run: npx --yes @capacitor/assets generate --android || echo "icon generation skipped"

      - run: python patch_android.py

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SocialHub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
