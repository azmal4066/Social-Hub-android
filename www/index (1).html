<style>
:root{--bg:#0b0f14;--sf:#262b32;--tx:#f5f6f7;--mt:#a3a9b1;--ln:#1c222a;--ac:#8ea6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
#main{flex:1;overflow-y:auto;position:relative;min-height:0}
#main.reels{overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.top h1{font:400 34px "Grand Hotel",cursive}

const NOTES_SQL=`-- v9: Instagram-style notes (short text + optional song, visible 24h)
-- Supabase -> SQL Editor -> paste -> Run
create table if not exists public.notes (
  user_id    uuid primary key references public.profiles(id) on delete cascade,
  content    text not null default '' check (char_length(content) <= 60),
  music      jsonb,
  created_at timestamptz not null default now(),
  expires_at timestamptz not null default (now() + interval '24 hours')
);
alter table public.notes enable row level security;
grant select, insert, update, delete on public.notes to authenticated;

drop policy if exists "notes read" on public.notes;
create policy "notes read" on public.notes for select to authenticated using (
  (select auth.uid()) = user_id
  or exists (select 1 from public.follows f
             where f.follower_id = (select auth.uid())
               and f.following_id = notes.user_id
               and f.status = 'accepted')
);
drop policy if exists "notes insert own" on public.notes;
create policy "notes insert own" on public.notes for insert to authenticated with check ((select auth.uid()) = user_id);
drop policy if exists "notes update own" on public.notes;
create policy "notes update own" on public.notes for update to authenticated using ((select auth.uid()) = user_id) with check ((select auth.uid()) = user_id);
drop policy if exists "notes delete own" on public.notes;
create policy "notes delete own" on public.notes for delete to authenticated using ((select auth.uid()) = user_id);

notify pgrst, 'reload schema';

create table if not exists public.note_reactions (
  note_user  uuid not null references public.profiles(id) on delete cascade,
  user_id    uuid not null references public.profiles(id) on delete cascade,
  emoji      text not null check (char_length(emoji) between 1 and 16),
  created_at timestamptz not null default now(),
  primary key (note_user, user_id)
);

grant select, insert, update, delete on public.note_reactions to authenticated;

drop policy if exists "nr read" on public.note_reactions;
create policy "nr read" on public.note_reactions for select to authenticated
  using (user_id = (select auth.uid()) or note_user = (select auth.uid()));
drop policy if exists "nr insert" on public.note_reactions;
create policy "nr insert" on public.note_reactions for insert to authenticated with check (user_id = (select auth.uid()));
drop policy if exists "nr update" on public.note_reactions;
create policy "nr update" on public.note_reactions for update to authenticated
  using (user_id = (select auth.uid())) with check (user_id = (select auth.uid()));
drop policy if exists "nr delete" on public.note_reactions;
create policy "nr delete" on public.note_reactions for delete to authenticated
  using (user_id = (select auth.uid()) or note_user = (select auth.uid()));

notify pgrst, 'reload schema';

const NFC={at:0,list:null,p:null};
const nfq=async p=>{try{const r=await p;return r&&r.data?r.data:[]}catch(e){return[]}};
async function loadNotifs(force){
 if(!S.me)return[];
 if(!force&&NFC.list&&Date.now()-NFC.at<45000)return NFC.list;
 if(NFC.p)return NFC.p;
 NFC.p=(async()=>{try{
  const me=S.me.id,T=x=>new Date(x).getTime()||0,ord=(q,c='created_at')=>q.order(c,{ascending:false});
  const[lk,cm,rp,fi,fo,nr,sl,ms,gm]=await Promise.all([
   nfq(ord(sb.from('likes').select('post_id,user_id,created_at,posts!inner(id,image_url,media_type,kind,user_id)').eq('posts.user_id',me).neq('user_id',me)).limit(120)),
   nfq(ord(sb.from('comments').select('post_id,user_id,body,created_at,posts!inner(id,image_url,media_type,kind,user_id)').eq('posts.user_id',me).neq('user_id',me)).limit(120)),
   nfq(ord(sb.from('reposts').select('post_id,user_id,created_at,posts!inner(id,image_url,media_type,kind,user_id)').eq('posts.user_id',me).neq('user_id',me)).limit(80)),
   nfq(ord(sb.from('follows').select('follower_id,status,created_at').eq('following_id',me)).limit(120)),
   nfq(ord(sb.from('follows').select('following_id,created_at').eq('follower_id',me).eq('status','accepted')).limit(60)),
   nfq(ord(sb.from('note_reactions').select('user_id,emoji,created_at').eq('note_user',me).neq('user_id',me)).limit(60)),
   nfq(ord(sb.from('story_likes').select('story_id,user_id,story_url,created_at').eq('owner_id',me).neq('user_id',me)).limit(100)),
   nfq(ord(sb.from('messages').select('sender_id,body,kind,post_id,created_at').eq('receiver_id',me).or('post_id.not.is.null,kind.eq.call')).limit(60)),
   nfq(ord(sb.from('group_members').select('group_id,joined_at,groups(name,created_by)').eq('user_id',me),'joined_at').limit(30))]);
  let it=[];
  lk.forEach(x=>it.push({t:T(x.created_at),ty:'like',u:x.user_id,p:x.posts}));
  cm.forEach(x=>it.push({t:T(x.created_at),ty:'cm',u:x.user_id,p:x.posts,body:x.body}));
  rp.forEach(x=>it.push({t:T(x.created_at),ty:'rp',u:x.user_id,p:x.posts}));
  fi.forEach(x=>it.push({t:T(x.created_at),ty:x.status==='pending'?'freq':'fol',u:x.follower_id}));
  fo.forEach(x=>it.push({t:T(x.created_at),ty:'facc',u:x.following_id}));
  nr.forEach(x=>it.push({t:T(x.created_at),ty:'nrx',u:x.user_id,e:x.emoji}));
  sl.forEach(x=>it.push({t:T(x.created_at),ty:'sl',u:x.user_id,img:x.story_url}));
  ms.forEach(x=>{if(x.post_id)it.push({t:T(x.created_at),ty:'shr',u:x.sender_id,pid:x.post_id});else if(x.kind==='call'&&/^missed/i.test(x.body||''))it.push({t:T(x.created_at),ty:'call',u:x.sender_id,body:x.body})});
  gm.forEach(x=>{if(x.groups&&x.groups.created_by&&x.groups.created_by!==me)it.push({t:T(x.joined_at),ty:'grp',u:x.groups.created_by,name:x.groups.name})});
  it.sort((a,b)=>b.t-a.t);it=it.slice(0,150);
  const uids=[...new Set(it.map(n=>n.u).filter(Boolean))],pids=[...new Set(it.filter(n=>n.ty==='shr').map(n=>n.pid))];

  const PR={},PP={};pr.forEach(x=>PR[x.id]=x);ps.forEach(x=>PP[x.id]=x);
  const list=[];
  it.forEach(n=>{const u=PR[n.u];if(!u)return;if(n.ty==='facc'&&!u.is_private)return;n.un=u.username;if(n.ty==='shr')n.p=PP[n.pid]||null;list.push(n)});
  NFC.list=list;NFC.at=Date.now();return list
 }finally{NFC.p=null}})();
 return NFC.p}
const NFB={like:['#ff3b5c','heart',1],cm:['#4a6cf7','comment'],rp:['#1fb35b','repost'],fol:['#8e5cff','user'],freq:['#8e5cff','user'],facc:['#8e5cff','user'],shr:['#4a5cf7','send'],sl:['#ff3b5c','heart',1],nrx:['#ff3b5c','heart',1],call:['#ff9800','bell'],grp:['#00a5b5','users']};
function nfThumb(p){if(!p||!p.image_url)return'';const u=esc(p.image_url);return p.media_type==='video'?`<video src="${u}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${u}" alt="" loading="lazy" onerror="this.remove()">`}
function nfText(n){const b=`<b>${esc(n.un)}</b>`,k=n.p&&n.p.kind==='reel'?'reel':'post';
 switch(n.ty){
  case'like':return`${b} liked your ${k}.`;

  case'shr':return`${b} sent you a ${k}.`;

 return b}
function nfRow(n){const bg=NFB[n.ty]||['#4a5cf7','bell'],pf=`data-a="go" data-v="profile" data-id="${n.u}"`;
 let bd=n.ty==='nrx'&&!/^(❤|♥)/.test(n.e||'')?esc(n.e||'♥'):ic(bg[1],13),right='';

 return`<div class="nf"${n.ty==='freq'?` id="rq${n.u}"`:''}><div class="nfa" ${pf}>${av(n.un,52)}<span class="nfb ${bg[2]?'f':''}" style="background:${bg[0]}">${bd}</span></div><div class="nft" ${pf}>${nfText(n)}<em>${ago(n.t)}</em></div>${right}</div>`}
function nfRender(l){
 const d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime(),DAY=864e5;
 const sec=t=>t>=t0?'Today':t>=t0-DAY?'Yesterday':t>=t0-6*DAY?'Last 7 days':t>=t0-29*DAY?'Last 30 days':'Earlier';

 l.forEach(n=>{const s=sec(n.t);if(s!==cur){cur=s;h+=`<div class="nfh">${s}</div>`}h+=nfRow(n)});
 return h}

function rpbDraw(){const o=$('#rpb');o&&o.remove();const r=S.reply,cb=$('#cb');if(!r||!cb)return;cb.insertAdjacentHTML('beforebegin',`<div class="rpb" id="rpb"><div><b>Replying to ${esc(r.n)}</b><small>${esc(r.b)}</small></div><button class="ib" data-a="rpx" aria-label="Cancel reply">${ic('x',22)}</button></div>`)}
const _sendMsg=sendMsg;sendMsg=async function(o){o=o||{};if(S.reply&&(!o.kind||o.kind==='text'||o.kind==='sticker')){o={...o,meta:{...(o.meta||{}),reply:S.reply}};S.reply=null;const b=$('#rpb');b&&b.remove()}return _sendMsg(o)};

/* ---- chat list menu ---- */
async function chatMenu(el){const id=el.dataset.id,g=el.dataset.a==='gopen',me=S.me.id,name=((el.querySelector('b')||{}).textContent||'').replace(/\s*📌$/,'').trim();let muted=false,blocked=false;
 try{if(g){const r=await sb.from('group_members').select('muted').match({group_id:id,user_id:me}).maybeSingle();muted=!!(r.data&&r.data.muted)}else{const[a,b]=await Promise.all([sb.from('chat_prefs').select('muted').match({user_id:me,peer_id:id}).maybeSingle(),sb.from('blocks').select('blocked_id').match({blocker_id:me,blocked_id:id}).maybeSingle()]);muted=!!(a.data&&a.data.muted);blocked=!!b.data}}catch(e){}
 S.cmT={id,g,name,muted,blocked};const pin=pinSet().has(id);const R=(i,l,a,d)=>`<button class="lpr ${d?'d':''}" data-a="${a}"><i>${i}</i>${l}</button>`;
 ov(`<div class="pn lps" data-a="noop"><div class="grab"></div><div class="lph">${av(name,48)}<div><b>${esc(name)}</b><small>${g?'Group chat':'Chat'}</small></div></div>${R('📌',pin?'Unpin chat':'Pin chat','cmpin')}${R(muted?'🔔':'🔕',muted?'Unmute notifications':'Mute notifications','cmmute')}${g?'':R('👤','View profile','cmprof')}${g?'':R(blocked?'✅':'🚫',blocked?'Unblock':'Block','cmblk')}${g?'':R('⚠️','Report','cmrep')}${R('🗑️',g?'Leave group':'Delete chat','cmdel',1)}</div>`)}
Object.assign(A,{
 cmpin:()=>{closeSh();const T=S.cmT,s=pinSet();if(s.has(T.id)){s.delete(T.id);toast('Unpinned')}else{if(s.size>=5){toast('You can pin up to 5 chats');return}s.add(T.id);toast('Pinned')}pinSave();go('msgs')},
 cmmute:async()=>{closeSh();const T=S.cmT,on=!T.muted,me=S.me.id;const r=T.g?await sb.from('group_members').update({muted:on}).match({group_id:T.id,user_id:me}):await sb.from('chat_prefs').upsert({user_id:me,peer_id:T.id,muted:on},{onConflict:'user_id,peer_id'});if(r.error){toast('Could not update');return}if(S.mu){on?S.mu.add(T.id):S.mu.delete(T.id)}toast(on?'Notifications muted':'Notifications on')},
 cmprof:()=>{closeSh();go('profile',S.cmT.id)},
 cmblk:async()=>{closeSh();const T=S.cmT,me=S.me.id;const r=T.blocked?await sb.from('blocks').delete().match({blocker_id:me,blocked_id:T.id}):await sb.from('blocks').insert({blocker_id:me,blocked_id:T.id});if(r.error&&r.error.code!=='23505'){toast('Could not update');return}toast(T.blocked?'Unblocked':'Blocked')},
 cmrep:async()=>{closeSh();const r=await sb.from('reports').insert({reporter_id:S.me.id,reported_id:S.cmT.id,reason:'Reported from chat list'});toast(r.error?'Could not report':'Thanks, we received your report')},
 cmdel:()=>{closeSh();const T=S.cmT;ov(`<div class="pn lps" data-a="noop"><div class="grab"></div><h3>${T.g?'Leave this group?':'Delete this chat?'}</h3><small class="chint">${T.g?'You will stop receiving messages from this group.':'This removes the chat for you only. '+esc(T.name)+' will still have their copy.'}</small><div class="lpd2"><button class="btn" data-a="mmx">Cancel</button><button class="go" style="background:linear-gradient(135deg,#ff5a6a,#d6254a);box-shadow:0 8px 22px #ff5a6a45" data-a="cmdel2">${T.g?'Leave':'Delete'}</button></div></div>`)},
 cmdel2:async()=>{closeSh();const T=S.cmT,me=S.me.id;const r=T.g?await sb.from('group_members').delete().match({group_id:T.id,user_id:me}):await sb.from('chat_prefs').upsert({user_id:me,peer_id:T.id,cleared_at:new Date().toISOString()},{onConflict:'user_id,peer_id'});if(r.error){toast('Could not delete');return}pinSet().delete(T.id);pinSave();toast(T.g?'Left group':'Chat deleted');go('msgs')}
});
